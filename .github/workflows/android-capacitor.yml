name: Android release gate

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versione esatta da firmare (es. 1.0.116)"
        required: true
        type: string
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-android:
    name: Validate Android
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install locked dependencies
        run: npm ci

      - name: Check release configuration
        run: npm run release:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build frontend and sync Capacitor
        run: npm run cap:sync

      - name: Ensure gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: Build debug APK
        run: npm run android:apk

      - name: Upload debug APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: motrice-app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-signed-aab:
    name: Build verified signed AAB
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-android
    runs-on: ubuntu-latest
    environment: android-internal
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      PLAY_LATEST_VERSION_CODE: ${{ vars.PLAY_LATEST_VERSION_CODE }}
      EXPECTED_VERSION: ${{ inputs.release_version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: app/release.keystore
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Require complete release credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD"
          test -n "$ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS"
          test -n "$ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD"
          test -n "$PLAY_LATEST_VERSION_CODE"

      - name: Install locked dependencies
        run: npm ci

      - name: Decode upload keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release.keystore

      - name: Build and verify signed release
        run: npm run release:android -- --expected-version="$EXPECTED_VERSION"

      - name: Upload verified AAB and checksum
        uses: actions/upload-artifact@v6
        with:
          name: motrice-app-release-aab
          path: |
            releases/${{ inputs.release_version }}/aab/app-release.aab
            releases/${{ inputs.release_version }}/aab/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f mobile/android/app/release.keystore
